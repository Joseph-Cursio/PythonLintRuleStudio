[project]
name = "ruff-studio"
version = "0.1.0"
description = ""
license = "MIT"
authors = [
    {name = "google-labs-jules[bot]",email = "161369871+google-labs-jules[bot]@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff (>=0.14.10,<0.15.0)",
    "tomlkit (>=0.13.3,<0.14.0)",
    "customtkinter (>=5.2.2,<6.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "pyyaml (>=6.0.1,<7.0.0)"
]

[tool.poetry]
packages = [{include = "ruff_studio", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
